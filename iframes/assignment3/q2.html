```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Map</title>
</head>

<body>

    <!-- Google Map showing the city -->
    <h1>My City Map</h1>

    <!-- loading="lazy" loads the map only when it is close to being visible on the screen -->
    <iframe
        src="https://www.google.com/maps?q=Delhi,India&output=embed"
        title="Google Map showing Delhi"
        width="100%"
        height="500"
        loading="lazy">
    </iframe>

</body>
</html>
```
