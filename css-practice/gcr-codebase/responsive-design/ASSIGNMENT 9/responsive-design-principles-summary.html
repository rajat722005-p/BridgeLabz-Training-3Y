<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Design Principles</title>
    <link rel="stylesheet" href="responsive-design-principles-summary.css">
</head>
<body>

    <main>
        <h1>Responsive Design Principles</h1>

        <section class="principles">

            <article class="principle">
                <h2>Fluid Layouts</h2>
                <p>A fluid layout adjusts according to screen width.</p>
                <code>width: 100%;</code>
            </article>

            <article class="principle">
                <h2>Flexible Media</h2>
                <p>Images and media should fit within their containers.</p>
                <code>max-width: 100%;</code>
            </article>

            <article class="principle">
                <h2>Breakpoints</h2>
                <p>Breakpoints change the layout at different screen sizes.</p>
                <code>@media (max-width: 600px)</code>
            </article>

        </section>
    </main>

</body>
</html>
