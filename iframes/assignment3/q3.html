```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Example</title>
</head>

<body>

    <!-- First iframe displays the introduction page -->
    <h1>My Introduction</h1>

    <iframe
        src="introduction.html"
        title="Introduction Page"
        width="100%"
        height="250">
    </iframe>

    <!-- Second iframe displays the favorite hobby page -->
    <h1>My Favorite Hobby</h1>

    <iframe
        src="hobby.html"
        title="Favorite Hobby Page"
        width="100%"
        height="250">
    </iframe>

</body>
</html>
