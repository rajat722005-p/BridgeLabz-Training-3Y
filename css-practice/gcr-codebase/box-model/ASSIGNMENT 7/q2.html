<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width Practice</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>

    <header>
        <h1>Height and Width Practice</h1>
    </header>

    <main>
        <section class="box-container">

            <article class="box box-one">
                <h2>Box 1</h2>
                <p>Width: 220px<br>Height: 180px</p>
            </article>

            <article class="box box-two">
                <h2>Box 2</h2>
                <p>Width: 45%<br>Height: 30vh</p>
                <p>
                    This box demonstrates overflow property with additional content.
                </p>
            </article>

            <article class="box box-three">
                <h2>Box 3</h2>
                <p>Width: 15em<br>Height: 12em</p>
            </article>

        </section>
    </main>

    <footer>
        <p>CSS Height and Width Practice</p>
    </footer>

</body>
</html>
