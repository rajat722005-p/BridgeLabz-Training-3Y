<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Object Updater</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        input {
            display: block;
            width: 300px;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        pre {
            background: #f2f2f2;
            padding: 15px;
            width: 300px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <h2>Update User Details</h2>

    <form id="userForm">

        <label for="userName">Name:</label>
        <input type="text" id="userName" value="John" required>

        <label for="userEmail">Email:</label>
        <input type="email" id="userEmail" value="john@mail.com" required>

        <label for="userAge">Age:</label>
        <input type="number" id="userAge" value="21" min="1" required>

        <button type="submit">Update User</button>

    </form>

    <h3>Updated User Details</h3>

    <pre id="userDetails"></pre>

    <script src="q8.js"></script>

</body>
</html>
