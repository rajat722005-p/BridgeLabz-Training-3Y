```
<style>
    body {
        font-family: Arial, sans-serif;

    textarea {
        width: 350px;

    }

        color: green;
    }

        color: #d4a000;
    }

        color: red;
    }

    button {
        padding: 10px 20px;
        cursor: pointer;
    }
</style>
```

</head>

    <h2>Live Character Counter</h2>

```
<textarea id="message" maxlength="100"
