<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Tracker</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="q7.css">
</head>

<body class="bg-light">

    <header class="bg-primary text-white py-4">
        <div class="container d-flex justify-content-between align-items-center">

            <div>
                <h1 class="fw-bold mb-1">Task Tracker</h1>
                <p class="mb-0">Manage your daily work efficiently</p>
            </div>

            <!-- Badge counter -->
            <span class="badge bg-warning text-dark fs-6">
                Pending: 4
            </span>

        </div>
    </header>

    <main>
        <section class="container py-5">

            <div class="card shadow-sm">
                <div class="card-body">

                    <h2 class="mb-4">My Tasks</h2>

                    <!-- Bootstrap list group -->
                    <div class="list-group">

                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            <span>Complete HTML Assignment</span>
                            <span class="badge bg-danger">High</span>
                        </div>

                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            <span>Practice Java DSA</span>
                            <span class="badge bg-warning text-dark">Medium</span>
                        </div>

                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            <span>Read Cybersecurity Notes</span>
                            <span class="badge bg-success">Low</span>
                        </div>

                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            <span>Prepare LinkedIn Post</span>
                            <span class="badge bg-danger">High</span>
                        </div>

                    </div>

                    <!-- Button containing badge -->
                    <button class="btn btn-success mt-4">
                        Completed
                        <span class="badge bg-light text-success ms-1">3</span>
                    </button>

                </div>
            </div>

        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">© 2026 Task Tracker</p>
    </footer>

</body>
</html>
