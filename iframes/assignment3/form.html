<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Form</title>
</head>

<body>

    <!-- Form -->
    <h1>Student Form</h1>

    <form action="result.html" target="resultFrame">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <br><br>

        <input type="submit" value="Submit">

    </form>

    <!-- Result will appear here after submitting -->
    <iframe
        name="resultFrame"
        title="Form Result"
        width="100%"
        height="150">
    </iframe>

</body>

</html>
