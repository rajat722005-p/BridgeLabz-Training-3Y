<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>

    <header>
        <h1>Responsive Image Filter Gallery</h1>
    </header>

    <main>
        <section class="gallery">

            <figure>
                <img src="image1.jpg" class="blur" alt="Nature">
                <figcaption>Blur</figcaption>
            </figure>

            <figure>
                <img src="image2.jpg" class="grayscale" alt="Mountain">
                <figcaption>Grayscale</figcaption>
            </figure>

            <figure>
                <img src="image3.jpg" class="sepia" alt="Forest">
                <figcaption>Sepia</figcaption>
            </figure>

            <figure>
                <img src="image4.jpg" class="brightness" alt="Lake">
                <figcaption>Brightness</figcaption>
            </figure>

            <figure>
                <img src="image5.jpg" class="contrast" alt="Beach">
                <figcaption>Contrast</figcaption>
            </figure>

            <figure>
                <img src="image6.jpg" class="hue" alt="City">
                <figcaption>Hue Rotate</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>CSS Filter Gallery</p>
    </footer>

</body>
</html>
