<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tourist Selection</title>
</head>
<body>

    <!-- Selection heading -->
    <h1>Tourist Destination Selection</h1>

    <!-- Country selection -->
    <label for="country">Country:</label>
    <select id="country">
        <option selected>India</option>
        <option>Nepal</option>
        <option>Japan</option>
    </select>

    <br><br>

    <!-- State selection -->
    <label for="state">State:</label>
    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Rajasthan</option>
        <option>Goa</option>
    </select>

    <br><br>

    <!-- City selection -->
    <label for="city">City:</label>
    <select id="city">
        <option selected>Agra</option>
        <option>Jaipur</option>
        <option>Lucknow</option>
    </select>

    <br><br>

    <!-- Tourist place selection -->
    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
        <option selected>Taj Mahal</option>
        <option>Amer Fort</option>
        <option>Goa Beach</option>
    </select>

    <!-- Summary -->
    <p>
        My choices are India, Uttar Pradesh, Agra and my favorite
        tourist place is Taj Mahal.
    </p>

</body>
</html>
