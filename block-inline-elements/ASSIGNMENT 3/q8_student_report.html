<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report</title>
</head>
<body>

    <!-- School name -->
    <h1>ABC Senior Secondary School</h1>

    <h2>Student Report Card</h2>

    <!-- Student marks table -->
    <table border="1" title="Student Marks Report">

        <tr>
            <th rowspan="2">Subject</th>
            <th colspan="2">Marks</th>
        </tr>

        <tr>
            <th>Maximum</th>
            <th>Obtained</th>
        </tr>

        <tr>
            <td>English</td>
            <td>100</td>
            <td>85</td>
        </tr>

        <tr>
            <td>Mathematics</td>
            <td>100</td>
            <td>90</td>
        </tr>

        <tr>
            <td>Physics</td>
            <td>100</td>
            <td>82</td>
        </tr>

        <tr>
            <td>Chemistry</td>
            <td>100</td>
            <td>88</td>
        </tr>

        <tr>
            <td>Computer Science</td>
            <td>100</td>
            <td>95</td>
        </tr>

        <tr>
            <th colspan="2" title="Total Marks">Total</th>
            <td>440</td>
        </tr>

        <tr>
            <th colspan="2">Percentage</th>
            <td>88%</td>
        </tr>

    </table>

</body>
</html>
