<!DOCTYPE html>
<html>
<head>
    <title>Inline Formatting</title>
</head>
<body>
    <p>
        I enjoy <strong>coding</strong>,
        <em>learning</em>,
        <mark>web development</mark>,
        using <code>HTML</code>,
        and reading <cite>technology blogs</cite>.
    </p>
</body>
</html>
