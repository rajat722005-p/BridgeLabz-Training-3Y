<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="q10.css">
</head>
<body>

<header class="header">
    <h1>My Mini UI</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<main>

    <section class="card">

        <div class="content">

            <div>
                <h2>Welcome!</h2>
                <p>Fill the form to get started.</p>

                <form>

                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Enter your name">

                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email">

                    <div class="buttons">
                        <button type="submit">Submit</button>
                        <button type="reset" class="reset">Reset</button>
                    </div>

                </form>
            </div>

            <img
                src="https://picsum.photos/300/250"
                alt="Sample landscape image"
            >

        </div>

    </section>

</main>

<footer>
    <p>&copy; 2026 My Mini UI. All Rights Reserved.</p>
</footer>

</body>
</html>
