<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechStore Product Catalog</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="q3.css">
</head>

<body>

    <header class="bg-primary text-white text-center py-4">
        <h1 class="fw-bold">TechStore</h1>
        <p class="mb-0">Latest Gadgets at Best Prices</p>
    </header>

    <main>
        <section class="container py-5">

            <div class="text-center mb-5">
                <h2 class="fw-bold">Our Products</h2>
                <p class="text-muted">Choose your favorite technology products.</p>
            </div>

            <!-- row creates grid -->
            <div class="row g-4">

                <!-- col-sm-6 = 2 columns on tablets -->
                <!-- col-lg-3 = 4 columns on large screens -->
                <div class="col-12 col-sm-6 col-lg-3">
                    <article class="card product-card shadow-sm h-100">
                        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80"
                             class="card-img-top"
                             alt="Headphones">

                        <div class="card-body text-center">
                            <h3 class="card-title">Wireless Headphones</h3>
                            <p class="text-primary fw-bold">₹2,999</p>
                            <button class="btn btn-primary">Add to Cart</button>
                        </div>
                    </article>
                </div>

                <div class="col-12 col-sm-6 col-lg-3">
                    <article class="card product-card shadow-sm h-100">
                        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80"
                             class="card-img-top"
                             alt="Smart Watch">

                        <div class="card-body text-center">
                            <h3 class="card-title">Smart Watch</h3>
                            <p class="text-primary fw-bold">₹4,499</p>
                            <button class="btn btn-primary">Add to Cart</button>
                        </div>
                    </article>
                </div>

                <div class="col-12 col-sm-6 col-lg-3">
                    <article class="card product-card shadow-sm h-100">
                        <img src="https://images.unsplash.com/photo-1588829081284-9d6c5a31b25c?auto=format&fit=crop&w=500&q=80"
                             class="card-img-top"
                             alt="Laptop">

                        <div class="card-body text-center">
                            <h3 class="card-title">Laptop</h3>
                            <p class="text-primary fw-bold">₹59,999</p>
                            <button class="btn btn-primary">Add to Cart</button>
                        </div>
                    </article>
                </div>

                <div class="col-12 col-sm-6 col-lg-3">
                    <article class="card product-card shadow-sm h-100">
                        <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=500&q=80"
                             class="card-img-top"
                             alt="Smartphone">

                        <div class="card-body text-center">
                            <h3 class="card-title">Smartphone</h3>
                            <p class="text-primary fw-bold">₹29,999</p>
                            <button class="btn btn-primary">Add to Cart</button>
                        </div>
                    </article>
                </div>

            </div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">© 2026 TechStore</p>
    </footer>

</body>
</html>
