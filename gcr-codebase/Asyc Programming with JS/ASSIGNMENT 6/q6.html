<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fake Store - Product Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
            color: #222;
        }

        header {
            background-color: white;
            text-align: center;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        #loading-message,
        #error-message {
            text-align: center;
            margin: 20px;
            font-size: 18px;
        }

        #error-message {
            color: red;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .product-card {
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-image {
            width: 100%;
            height: 140px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .product-title {
            font-size: 14px;
            line-height: 1.5;
            margin: 0 0 12px;
            overflow-wrap: anywhere;
        }

        .product-price {
            color: #008060;
            font-size: 16px;
            font-weight: bold;
            margin-top: auto;
        }

        /* Responsive layout for smaller screens */
        @media (max-width: 1000px) {
            .product-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 600px) {
            .product-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                padding: 10px;
                gap: 10px;
            }

            header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🛍️ Fake Store - Product Dashboard</h1>
    </header>

    <p id="loading-message">Loading products...</p>

    <p id="error-message" role="alert"></p>

    <main id="product-container" class="product-grid"></main>

    <!-- Connect the external JavaScript file -->
    <script src="q6.js"></script>

</body>
</html>
