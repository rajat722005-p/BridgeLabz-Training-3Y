<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="filter-comparison-layout.css">
</head>
<body>

    <main>
        <h1>Before & After Filter Comparison</h1>

        <section class="comparison">

            <figure>
                <img src="before.jpg" alt="Original Image">
                <figcaption>Before Filter</figcaption>
            </figure>

            <figure>
                <img src="after.jpg" class="filtered" alt="Filtered Image">
                <figcaption>After Filter</figcaption>
            </figure>

        </section>
    </main>

</body>
</html>
