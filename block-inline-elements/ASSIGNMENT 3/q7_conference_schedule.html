<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Conference Schedule</title>
</head>
<body>

    <!-- Conference heading -->
    <header>
        <h1>Technology Conference 2026</h1>
    </header>

    <!-- Conference schedule -->
    <table border="1">

        <thead>
            <tr>
                <th>Session</th>
                <th>Time</th>
                <th>Topic</th>
                <th>Speaker</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Morning</td>
                <td>10:00 AM</td>
                <td>Artificial Intelligence</td>
                <td>Dr. Sharma</td>
            </tr>
            <tr>
                <td>Afternoon</td>
                <td>1:00 PM</td>
                <td>Cybersecurity</td>
                <td>Mr. Verma</td>
            </tr>
            <tr>
                <td>Evening</td>
                <td>5:00 PM</td>
                <td>Cloud Computing</td>
                <td>Ms. Priya</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="4">Conference Schedule Ends at 6:00 PM</td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
