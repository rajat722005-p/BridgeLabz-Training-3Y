```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>File Upload</title>
</head>

<body>

    <!-- File Upload Form -->
    <h1>Upload Image</h1>

    <form>

        <label for="image">Choose an image:</label>
        <input type="file" id="image" name="image" accept=".jpg, .png">

        <p>Only JPG and PNG image files are allowed.</p>

        <input type="submit" value="Upload">

    </form>

</body>

</html>
```
