```
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 30px;
    }

    #mouseBox {
        width: 400px;
        height: 400px;
        max-width: 100%;
        box-sizing: border-box;
        border: 2px solid black;
        background-color: #eeeeee;
        position: relative;
        overflow: hidden;
    }

    #coordinates {
        margin: 15px 0;
        font-weight: bold;
    }

    .dot {
        width: 10px;
        height: 10px;
        background-color: red;
        border-radius: 50%;
        position: absolute;
        transform: translate(-50%, -50%);
        pointer-events: none;
    }
</style>
```

</head>
<body>
    <h2>Mouse Coordinates Logger</h2>

```
<p>Move your mouse inside the box. Double-click to drop a red dot.</p>

<div id="mouseBox"></div>

<p id="coordinates">clientX: 0, clientY: 0</p>
