```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>External Website</title>
</head>

<body>

    <!-- External website embedded using iframe -->
    <h1>Wikipedia</h1>

    <iframe
        src="https://www.wikipedia.org"
        title="Wikipedia Website"
        width="100%"
        height="500">
    </iframe>

    <!-- Security note -->
    <p>
        Some websites may not allow embedding for security reasons.
    </p>

</body>

</html>
```
