<!DOCTYPE html>
<html lang="en">

<head>
    <title>Frameset Layout</title>
</head>

<!-- Main frameset with top and bottom frames -->
<frameset rows="25%,75%">

    <!-- Top frame for navigation -->
    <frame src="navigation.html" name="navigation">

    <!-- Bottom frame for welcome message -->
    <frame src="welcome.html" name="welcome">

</frameset>

</html>
