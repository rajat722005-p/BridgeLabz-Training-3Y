<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="q8.css">
</head>

<body>

    <header class="header">
        <h1>My Dashboard</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">Profile</a>
            <a href="#">Settings</a>
        </nav>
    </header>

    <div class="dashboard">

        <aside class="sidebar">
            <h2>Menu</h2>

            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Users</a>
                <a href="#">Projects</a>
                <a href="#">Reports</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <main class="content">

            <h2>Dashboard Overview</h2>

            <section class="boxes">

                <article class="box">
                    <h3>Total Users</h3>
                    <p class="number">1,250</p>
                    <p>Users registered on the platform.</p>
                </article>

                <article class="box">
                    <h3>Active Projects</h3>
                    <p class="number">48</p>
                    <p>Projects currently in progress.</p>
                </article>

                <article class="box">
                    <h3>Completed Tasks</h3>
                    <p class="number">320</p>
                    <p>Tasks completed successfully.</p>
                </article>

            </section>

        </main>

    </div>

</body>
</html>
