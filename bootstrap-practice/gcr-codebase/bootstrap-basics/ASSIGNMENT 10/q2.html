<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rajat - Portfolio</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="q2.css">
</head>

<body class="bg-light text-dark">

    <header class="container text-center mt-4">
        <h1 class="fw-bold">Rajat</h1>
        <p class="lead">Java Developer | Web Developer | Cybersecurity Enthusiast</p>
    </header>

    <main>
        <section class="container text-center p-5 mt-4">

            <!-- img-fluid makes image responsive -->
            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=300&q=80"
                 alt="Profile"
                 class="img-fluid rounded-circle profile-img mb-4">

            <h2 class="fw-bold">Hello, I'm Rajat</h2>

            <p class="mt-4 mb-3">
                I am passionate about software development, problem solving,
                web technologies, and cybersecurity.
            </p>

            <!-- Bootstrap buttons -->
            <div class="mb-4">
                <a href="#" class="btn btn-primary me-2">Hire Me</a>
                <a href="#" class="btn btn-outline-dark">Download CV</a>
            </div>

            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">

                    <h3 class="fw-bold mb-3">Contact Me</h3>

                    <form>
                        <input type="text"
                               class="form-control mb-3"
                               placeholder="Your Name">

                        <input type="email"
                               class="form-control mb-3"
                               placeholder="Your Email">

                        <textarea class="form-control mb-3"
                                  rows="4"
                                  placeholder="Your Message"></textarea>

                        <button type="submit" class="btn btn-dark">
                            Send Message
                        </button>
                    </form>

                </div>
            </div>

        </section>
    </main>

    <footer class="text-center py-3 mt-4 bg-dark text-white">
        <p class="mb-0">© 2026 Rajat Portfolio</p>
    </footer>

</body>
</html>
