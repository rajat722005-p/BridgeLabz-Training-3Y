```html
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- UTF-8 supports characters from different languages -->
    <meta charset="UTF-8">
    <title>Three Languages</title>
</head>

<body>

    <!-- Text in English, Hindi and French -->
    <h1>Multilingual Webpage</h1>

    <p>
        English: Welcome to my webpage.
    </p>

    <p>
        Hindi: मेरी वेबसाइट पर आपका स्वागत है।
    </p>

    <p>
        French: Bienvenue sur ma page web.
    </p>

</body>

</html>
```
