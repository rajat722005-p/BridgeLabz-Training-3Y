<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing Comparison</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

<header>
    <h1>Box-Sizing Comparison</h1>
</header>

<main>

    <div class="comparison">

        <section class="box content-box">
            <h2>content-box</h2>
            <p>
                Width applies only to the content.
                Padding and border are added to the total size.
            </p>
        </section>

        <section class="box border-box">
            <h2>border-box</h2>
            <p>
                Width includes content, padding and border.
                This makes sizing easier to control.
            </p>
        </section>

    </div>

</main>

</body>
</html>
