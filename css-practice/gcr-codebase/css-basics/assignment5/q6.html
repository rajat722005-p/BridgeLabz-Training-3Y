<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Photo Gallery</title>
    <link rel="stylesheet" href="q6.css">
</head>

<body>

    <header>
        <h1>My Photo Gallery</h1>
        <p>A collection of beautiful moments</p>
    </header>

    <main>
        <section class="gallery">

            <figure class="photo">
                <img src="https://picsum.photos/id/1015/600/400" alt="Mountain">
                <figcaption>Beautiful Mountain</figcaption>
            </figure>

            <figure class="photo">
                <img src="https://picsum.photos/id/1016/600/400" alt="Nature">
                <figcaption>Peaceful Nature</figcaption>
            </figure>

            <figure class="photo">
                <img src="https://picsum.photos/id/1018/600/400" alt="Landscape">
                <figcaption>Green Landscape</figcaption>
            </figure>

            <figure class="photo">
                <img src="https://picsum.photos/id/1025/600/400" alt="Dog">
                <figcaption>Lovely Companion</figcaption>
            </figure>

            <figure class="photo">
                <img src="https://picsum.photos/id/1035/600/400" alt="River">
                <figcaption>Calm River</figcaption>
            </figure>

            <figure class="photo">
                <img src="https://picsum.photos/id/1043/600/400" alt="Forest">
                <figcaption>Beautiful Forest</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Photo Gallery</p>
    </footer>

</body>
</html>
