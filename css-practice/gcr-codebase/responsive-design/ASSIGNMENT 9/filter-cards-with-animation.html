<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="filter-cards-animation.css">
</head>
<body>

    <main>
        <h1>Profile Cards</h1>

        <section class="profiles">

            <article class="profile-card">
                <img src="profile1.jpg" class="gray" alt="Profile">
                <h2>Web Developer</h2>
                <p>Creates responsive and modern websites.</p>
            </article>

            <article class="profile-card">
                <img src="profile2.jpg" class="sepia" alt="Profile">
                <h2>Cybersecurity Analyst</h2>
                <p>Works on security monitoring and protection.</p>
            </article>

            <article class="profile-card">
                <img src="profile3.jpg" class="gray" alt="Profile">
                <h2>Software Engineer</h2>
                <p>Builds efficient and scalable applications.</p>
            </article>

        </section>
    </main>

</body>
</html>
