```html
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- UTF-8 encoding supports multiple languages and special characters -->
    <meta charset="UTF-8">

    <!-- Author of the webpage -->
    <meta name="author" content="Rajat Pandey">

    <!-- Makes the webpage adjust properly on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title of the webpage -->
    <title>UTF-8 Encoding Example</title>
</head>

<body>

    <!-- Multilingual text to verify UTF-8 encoding -->
    <h1>UTF-8 Encoding Test</h1>

    <p>
        Hello, welcome to my webpage.
        नमस्ते, मेरी वेबसाइट पर आपका स्वागत है।
        こんにちは、私のウェブサイトへようこそ。
    </p>

</body>

</html>
```
