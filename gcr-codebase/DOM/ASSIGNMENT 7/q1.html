<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
        }
        h2 {
            text-align: center;
        }
        input {
            padding: 10px;
            margin: 5px;
            cursor: pointer;
        }
        #addButton {
            background-color: green;
            color: white;
            border: none;
        }

        li{
            margin: 5px 0;
            padding: 10px;
            background-color: #eeeeee;
            overflow-wrap: anywhere;
        }

        .product-name {
           margin-right: 10px;
        }
        .edit-button, .delete-button {
          background-color: orange;
          border: none;
        }

        .delete-button {
            background-color: crimson;
            color: white;
            border: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Dynamic Product List</h2>
    <input type="text" id="productInput" placeholder="Enter product name">
    <button id="addButton">Add Product</button>
    <ul id="productList"></ul>
</div>
<script src="q1.js"></script>
</body>
</html>
