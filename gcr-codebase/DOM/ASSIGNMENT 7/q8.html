<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Dropdown</title>

```
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 40px;
    }

    #dropdown {
        position: relative;
        display: inline-block;
    }

    #dropdownButton {
        padding: 12px 20px;
        cursor: pointer;
        background-color: #2563eb;
        color: white;
        border: none;
        border-radius: 5px;
    }

    #options {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        min-width: 180px;
        background-color: white;
        border: 1px solid #ccc;
        box-shadow: 0 4px 8px #0002;
        z-index: 1;
    }

    #options.show {
        display: block;
    }

    .option {
        display: block;
        width: 100%;
        padding: 12px;
        border: none;
        background-color: white;
        text-align: left;
        cursor: pointer;
    }

    .option:hover {
        background-color: #ddd;
    }
</style>
```

</head>
<body>
    <h2>Custom Dropdown</h2>

```
<div id="dropdown">
    <button id="dropdownButton" type="button">
        Select a Course ▼
    </button>

    <div id="options">
        <button class="option" type="button">JavaScript</button>
        <button class="option" type="button">Python</button>
        <button class="option" type="button">Java</button>
        <button class="option" type="button">C++</button>
    </div>
</div>

<p id="selectedOption">No course selected.</p>

<script src="q8.js"></script>
```

</body>
</html>
