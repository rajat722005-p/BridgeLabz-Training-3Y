
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demo</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>

<header>
    <h1>CSS Tooltip Demonstration</h1>
</header>

<main>
    <div class="tooltip-container">

        <div class="tooltip-item">
            <span>HTML</span>
            <div class="tooltip">HyperText Markup Language</div>
        </div>

        <div class="tooltip-item">
            <span>CSS</span>
            <div class="tooltip">Cascading Style Sheets</div>
        </div>

        <div class="tooltip-item">
            <span>Flexbox</span>
            <div class="tooltip">CSS layout system</div>
        </div>

        <div class="tooltip-item">
            <span>Grid</span>
            <div class="tooltip">Two-dimensional CSS layout</div>
        </div>

    </div>
</main>

<footer>
    <p>Hover over each word to see the tooltip.</p>
</footer>

</body>
</html>
