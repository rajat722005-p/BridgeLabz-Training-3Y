```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login Form</title>
</head>

<body>

    <!-- Login Form -->
    <h1>Login Form</h1>

    <form>

        <!-- Username -->
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br><br>

        <!-- Password -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <!--
        CSRF token helps protect a form from Cross-Site Request Forgery attacks
        by verifying that the request came from the trusted website.
        -->
        <input type="hidden" name="csrf_token" value="dummy123">

        <input type="submit" value="Login">

    </form>

</body>

</html>
```
