<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaTech - Company Landing Page</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="q1.css">
</head>

<body>

    <!-- Full-width header -->
    <header class="bg-dark text-white">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <!-- Company name -->
                <a class="navbar-brand fw-bold" href="#">NovaTech</a>

                <!-- Responsive navbar button -->
                <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#mainNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="mainNavbar">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Services</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">About</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Contact</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <!-- Hero section -->
        <section class="hero-section text-white text-center">
            <div class="container">
                <!-- Bootstrap row -->
                <div class="row justify-content-center align-items-center min-vh-100">
                    <!-- Responsive column -->
                    <div class="col-12 col-md-10 col-lg-8">

                        <h1 class="display-2 fw-bold">
                            Build Your Future With NovaTech
                        </h1>

                        <p class="lead my-4">
                            Smart digital solutions that help businesses grow,
                            innovate, and succeed.
                        </p>

                        <!-- Bootstrap button -->
                        <a href="#" class="btn btn-primary btn-lg px-5">
                            Get Started
                        </a>

                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">© 2026 NovaTech. All Rights Reserved.</p>
    </footer>

</body>
</html>
