<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>

<header>
    <h1>Image Showcase</h1>
</header>

<main>
    <div class="gallery">

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/id/1015/500/350" alt="Mountain">
                <div class="overlay"></div>
            </div>
            <figcaption>Mountain View</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/id/1016/500/350" alt="Forest">
                <div class="overlay"></div>
            </div>
            <figcaption>Forest</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/id/1018/500/350" alt="Nature">
                <div class="overlay"></div>
            </div>
            <figcaption>Nature</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/id/1020/500/350" alt="River">
                <div class="overlay"></div>
            </div>
            <figcaption>River</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/id/1024/500/350" alt="Animal">
                <div class="overlay"></div>
            </div>
            <figcaption>Wildlife</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/id/1035/500/350" alt="Beach">
                <div class="overlay"></div>
            </div>
            <figcaption>Beach</figcaption>
        </figure>

    </div>
</main>

</body>
</html>
